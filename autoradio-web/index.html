<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="Autoradio vintage : FM, AM, DAB et radios du monde entier, égaliseur 9 bandes, mémoires. Fonctionne sur téléphone, tablette et ordinateur.">
<meta name="theme-color" content="#0b0f15">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Autoradio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Autoradio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  --bg: #0f141c;
  --surface: #1a2130;
  --surface2: #242c3d;
  --surface3: #2c3549;
  --border: #3a4558;
  --border-soft: #2a3345;
  --text: #f0f2f5;
  --text-dim: #a0a8b8;
  --text-mute: #6e7890;
  --accent: #4dffa8;
  --accent-dim: #1fa561;
  --amber: #ffc45c;
  --blue: #5b9fff;
  --red: #ff5a6a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  position: fixed; inset: 0; width: 100%; height: 100%;
  overflow: hidden;
  background: #0b0f15;
  font-family: 'Inter', system-ui, sans-serif;
  color: var(--text);
  user-select: none;
  -webkit-user-select: none;
}
body {
  background-image:
    radial-gradient(ellipse 80% 55% at 50% 0%, #17233a 0%, transparent 60%),
    radial-gradient(ellipse 45% 35% at 85% 90%, rgba(176,122,255,.07) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 12% 85%, rgba(91,159,255,.07) 0%, transparent 60%);
}

/* La face avant fait 680×450 et se met à l'échelle pour remplir la fenêtre */
#stage {
  position: absolute;
  left: 50%; top: 50%;
  width: 750px; height: 400px;
  transform: translate(-50%, -50%);
}

.chassis {
  position: relative;
  width: 750px; height: 400px;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid #3a4558;
  background:
    linear-gradient(180deg, rgba(255,255,255,.05), transparent 16%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px),
    linear-gradient(180deg, #232b3a 0%, #181e2b 50%, #10151e 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.09),
    inset 0 0 0 1px rgba(0,0,0,.45),
    0 20px 44px rgba(0,0,0,.6);
  display: grid;
  grid-template-rows: 110px 24px 40px minmax(0, 1fr) 52px;
  gap: 7px;
}
/* petites vis décoratives */
.screw {
  position: absolute;
  width: 6px; height: 6px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #5a6478, #1b2130 70%);
  box-shadow: 0 0 0 1px rgba(0,0,0,.5);
}
.screw::after {
  content: ''; position: absolute; left: 1px; right: 1px; top: 2.5px; height: 1px;
  background: rgba(0,0,0,.55); transform: rotate(35deg);
}
.screw.tl { top: 4px; left: 4px; } .screw.tr { top: 4px; right: 4px; }
.screw.bl { bottom: 4px; left: 4px; } .screw.br { bottom: 4px; right: 4px; }

/* ---------- Rangée 1 : afficheur + droite ---------- */
.top {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 12px;
  min-height: 0;
}

.disp {
  position: relative;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 8px 14px 8px;
  border-radius: 9px;
  border: 1px solid #1a3a28;
  background:
    radial-gradient(ellipse 90% 80% at 50% 40%, rgba(20,60,40,.55) 0%, transparent 70%),
    #070b09;
  box-shadow:
    inset 0 0 28px rgba(0,0,0,.55),
    inset 0 0 44px rgba(40,180,100,.08),
    0 0 0 1px rgba(77,255,168,.12),
    0 0 16px rgba(77,255,168,.2),
    0 0 32px rgba(77,255,168,.07);
  overflow: hidden;
}
.disp::before {
  content: ''; position: absolute; top: 0; left: 6%; right: 6%; height: 3px;
  background: linear-gradient(90deg, transparent, rgba(77,255,168,.4) 15%, rgba(77,255,168,.95) 50%, rgba(77,255,168,.4) 85%, transparent);
  box-shadow: 0 0 8px rgba(77,255,168,.7), 0 0 18px rgba(77,255,168,.4);
  animation: backlight 2.8s ease-in-out infinite alternate;
}
@keyframes backlight { from { opacity: .65; filter: brightness(.85); } to { opacity: 1; filter: brightness(1.2); } }
.disp > * { position: relative; z-index: 1; }
.meta {
  display: flex; justify-content: space-between;
  font-size: 10px; font-weight: 600; letter-spacing: .14em; color: var(--text-mute);
}
.meta .on { color: var(--accent); text-shadow: 0 0 8px rgba(77,255,168,.55); }
.freq {
  font-family: 'JetBrains Mono', monospace; font-weight: 600;
  font-size: 40px; line-height: 1; text-align: center; letter-spacing: .03em;
  color: #5fffb0;
  text-shadow: 0 0 6px rgba(77,255,168,.9), 0 0 18px rgba(77,255,168,.55), 0 0 32px rgba(77,255,168,.25);
}
.sname {
  font-size: 13px; font-weight: 600; text-align: center; letter-spacing: .04em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: #ffc86a;
  text-shadow: 0 0 6px rgba(255,184,77,.6), 0 0 14px rgba(255,184,77,.25);
}
.now { display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 0; }
.now .lbl {
  font-size: 9px; font-weight: 700; letter-spacing: .1em; color: var(--accent);
  border: 1px solid rgba(77,255,168,.45); background: rgba(77,255,168,.07);
  padding: 2px 6px; border-radius: 4px; box-shadow: 0 0 8px rgba(77,255,168,.25);
}
.now .trk {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #c8d0dc;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}

.right { display: flex; flex-direction: column; gap: 5px; min-width: 0; min-height: 0; }
.eq-row {
  height: 36px; padding: 4px 6px 0; display: flex; align-items: flex-end;
  background: #090d13; border: 1px solid var(--border-soft); border-radius: 7px;
  box-shadow: inset 0 0 12px rgba(0,0,0,.6);
}
.eq { display: flex; align-items: flex-end; gap: 2px; width: 100%; height: 32px; }
.eq-bar {
  flex: 1; min-width: 2px; min-height: 2px; border-radius: 1.5px 1.5px 0 0;
  background: linear-gradient(to top, var(--accent-dim), var(--accent)); opacity: .9;
  transition: height .06s linear;
}
.eq-presets { display: flex; flex-wrap: wrap; gap: 3px; }
.eq-presets .eq-btn { height: 18px; padding: 0 5px; font-size: 9px; letter-spacing: 0; }
.eq-btn, .tag {
  font-family: inherit; font-weight: 500; font-size: 10px; letter-spacing: .02em;
  height: 19px; padding: 0 7px; border-radius: 4px; cursor: pointer; white-space: nowrap;
  background: var(--surface2); border: 1px solid var(--border-soft); color: var(--text-mute);
  transition: all .12s;
}
.eq-btn:hover, .tag:hover {
  color: var(--blue); border-color: rgba(91,159,255,.5); box-shadow: 0 0 8px rgba(91,159,255,.28);
}
.eq-btn.active {
  background: rgba(77,255,168,.13); border-color: rgba(77,255,168,.55); color: var(--accent);
  box-shadow: 0 0 10px rgba(77,255,168,.35);
}
.search-row { display: flex; gap: 5px; margin-top: auto; }
.search-input {
  flex: 1; min-width: 0; height: 24px; padding: 0 10px;
  font-family: inherit; font-size: 11px; color: var(--text); outline: none;
  background: var(--bg); border: 1px solid var(--border-soft); border-radius: 6px;
  user-select: text; -webkit-user-select: text;
}
.search-input::placeholder { color: var(--text-mute); }
.search-input:focus { border-color: rgba(77,255,168,.45); box-shadow: 0 0 10px rgba(77,255,168,.15); }
.search-btn {
  font-family: inherit; font-size: 10px; font-weight: 700; letter-spacing: .08em;
  height: 24px; padding: 0 14px; border-radius: 6px; cursor: pointer;
  background: var(--surface3); border: 1px solid var(--border); color: var(--text-dim);
  transition: all .12s;
}
.search-btn:hover { color: var(--accent); border-color: rgba(77,255,168,.5); box-shadow: 0 0 10px rgba(77,255,168,.25); }

/* ---------- Rangée 2 : filtres rapides + flèches ---------- */
.tagbar { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tags {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 4px;
  overflow-x: auto; scrollbar-width: none;
  padding: 0 1px;
}
.tags::-webkit-scrollbar { display: none; }
.tags.fr { -webkit-mask-image: linear-gradient(90deg, #000 0, #000 92%, transparent 100%); mask-image: linear-gradient(90deg, #000 0, #000 92%, transparent 100%); }
.tags.fl { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 8%, #000 100%); mask-image: linear-gradient(90deg, transparent 0, #000 8%, #000 100%); }
.tags.fl.fr { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 8%, #000 92%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 8%, #000 92%, transparent 100%); }
.tag { height: 22px; padding: 0 10px; flex-shrink: 0; background: transparent; }
.tag.active { color: var(--blue); border-color: rgba(91,159,255,.55); background: rgba(91,159,255,.12); }
.tbtn {
  flex-shrink: 0; width: 28px; height: 22px; border-radius: 5px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-family: inherit; font-size: 15px; font-weight: 700; line-height: 1; padding-bottom: 2px;
  background: var(--surface3); border: 1px solid var(--border); color: var(--blue);
  transition: all .12s;
}
.tbtn:hover { background: rgba(91,159,255,.16); border-color: var(--blue); color: #8bb8ff; box-shadow: 0 0 9px rgba(91,159,255,.3); }
.tbtn:active { transform: scale(.93); }
.tbtn.off { opacity: .3; pointer-events: none; }

/* ---------- Rangée 3 : mémoires ---------- */
.mem { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); grid-template-rows: repeat(2, 18px); gap: 4px; height: 40px; }
.mbtn {
  height: 18px; min-height: 0;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  background: var(--surface2); border: 1px solid var(--border-soft); border-radius: 5px;
  cursor: pointer; transition: all .12s; overflow: hidden; padding: 0 3px;
}
.mbtn .n { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; color: var(--text-dim); }
.mbtn .f { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mbtn:hover { border-color: rgba(91,159,255,.45); background: var(--surface3); box-shadow: 0 0 8px rgba(91,159,255,.22); }
.mbtn.active {
  background: rgba(77,255,168,.14); border-color: rgba(77,255,168,.6);
  box-shadow: 0 0 12px rgba(77,255,168,.35), inset 0 0 8px rgba(77,255,168,.1);
}
.mbtn.active .n, .mbtn.active .f { color: var(--accent); }
.mbtn.empty { opacity: .45; }

/* ---------- Rangée 4 : liste des stations ---------- */
.list {
  display: flex; flex-direction: column; min-height: 0;
  background: var(--surface); border: 1px solid var(--border-soft); border-radius: 9px; overflow: hidden;
}
.list-h {
  display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
  padding: 0 12px; height: 22px;
  font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--text-mute);
  background: rgba(255,255,255,.025); border-bottom: 1px solid var(--border-soft);
}
.list-h #panelCount { color: var(--amber); font-family: 'JetBrains Mono', monospace; }
.results { flex: 1; min-height: 0; overflow-y: auto; }
.results::-webkit-scrollbar { width: 6px; }
.results::-webkit-scrollbar-thumb { background: #34405a; border-radius: 3px; }
.results::-webkit-scrollbar-track { background: transparent; }
.ritem {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 0 12px; height: 26px; cursor: pointer;
  font-size: 12px; border-bottom: 1px solid rgba(42,51,69,.6); border-left: 3px solid transparent;
  transition: background .1s;
}
.ritem .rn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ritem .rc { flex-shrink: 0; color: var(--text-mute); font-size: 10px; }
.ritem:hover { background: var(--surface2); }
.ritem.active { background: rgba(77,255,168,.08); color: var(--accent); border-left-color: var(--accent); }
.results .empty, .results .loading { padding: 26px; text-align: center; color: var(--text-mute); font-size: 12px; }

/* ---------- Rangée 5 : commandes ---------- */
.ctrl {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 0 16px;
  background: rgba(0,0,0,.24); border: 1px solid #222a3a; border-radius: 11px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
}
.kw { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 52px; }
.knob {
  position: relative; width: 32px; height: 32px; border-radius: 50%; cursor: grab;
  background: radial-gradient(circle at 35% 30%, #3e4558, #1b2030 55%, #0e1118);
  border: 1.5px solid #3a4258;
  box-shadow: 0 3px 8px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.1);
}
.knob::after {
  content: ''; position: absolute; top: 3px; left: 50%; transform: translateX(-50%);
  width: 3px; height: 9px; border-radius: 2px; background: var(--amber);
  box-shadow: 0 0 6px rgba(255,184,77,.6);
}
.klr { display: flex; gap: 4px; align-items: baseline; }
.kl { font-size: 8px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text-mute); }
.kv { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--amber); }

.rbtn {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-family: inherit; font-size: 10px; font-weight: 700; letter-spacing: .04em;
  background: var(--surface2); border: 1.5px solid var(--border); color: var(--text-mute);
  transition: all .15s;
}
.rbtn:hover { color: var(--blue); border-color: rgba(91,159,255,.55); box-shadow: 0 0 10px rgba(91,159,255,.3); }
.rbtn.pwr.on { border-color: var(--red); color: var(--red); box-shadow: 0 0 12px rgba(255,90,106,.45); }
.rbtn.play { width: 38px; height: 38px; font-size: 13px; }
.rbtn.play.on { border-color: rgba(77,255,168,.6); color: var(--accent); box-shadow: 0 0 14px rgba(77,255,168,.38); }
.rbtn.nav { width: 28px; height: 28px; font-size: 14px; }

.mid { display: flex; align-items: center; gap: 8px; }
.bands {
  display: flex; background: var(--bg); border: 1px solid var(--border-soft);
  border-radius: 7px; overflow: hidden;
}
.band {
  height: 28px; padding: 0 11px; border: none; background: transparent; cursor: pointer;
  font-family: inherit; font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--text-mute);
  transition: all .12s;
}
.band + .band { border-left: 1px solid var(--border-soft); }
.band:hover { color: var(--blue); }
.band.active {
  background: rgba(77,255,168,.13); color: var(--accent);
  text-shadow: 0 0 8px rgba(77,255,168,.45); box-shadow: inset 0 0 8px rgba(77,255,168,.08);
}

/* ===================== TACTILE ===================== */
html, body { touch-action: pan-x pan-y; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; overscroll-behavior: none; }
.results { touch-action: pan-y; overscroll-behavior: contain; }
.tags { touch-action: pan-x; overscroll-behavior: contain; }
.knob { touch-action: none; }
.eq-sel, .kbd { display: none; }

/* sélecteur d'égaliseur (mode tactile) */
.eq-sel { gap: 5px; height: 34px; }
.eq-sel button {
  width: 52px; flex-shrink: 0; border-radius: 8px; cursor: pointer;
  background: var(--surface3); border: 1px solid var(--border); color: var(--blue);
  font-family: inherit; font-size: 22px; font-weight: 700; line-height: 1; padding-bottom: 3px;
}
.eq-sel .eq-name {
  flex: 1; display: flex; align-items: center; justify-content: center; border-radius: 8px;
  background: var(--bg); border: 1px solid rgba(77,255,168,.4); color: var(--accent);
  font-size: 13px; font-weight: 700; letter-spacing: .14em;
  box-shadow: 0 0 10px rgba(77,255,168,.15);
}
.eq-sel .eq-name::before { content: "EQ"; color: var(--text-mute); font-size: 9px; margin-right: 9px; letter-spacing: .1em; }

/* clavier à l'écran */
.kbd {
  position: absolute; left: 12px; right: 12px; top: 128px; bottom: 12px; z-index: 30;
  flex-direction: column; gap: 5px; padding: 8px;
  background: rgba(10,14,21,.98); border: 1px solid var(--border); border-radius: 11px;
  box-shadow: 0 -10px 28px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
}
.kbd.open { display: flex; }
.krow { display: flex; gap: 5px; flex: 1; min-height: 0; }
.key {
  flex: 1; min-width: 0; border-radius: 8px; cursor: pointer;
  background: var(--surface2); border: 1px solid var(--border-soft); color: var(--text);
  font-family: inherit; font-size: 17px; font-weight: 600;
}
.key:active { background: rgba(77,255,168,.22); border-color: var(--accent); color: var(--accent); }
.key.wide { flex: 1.6; color: var(--amber); }
.key.space { flex: 6; font-size: 11px; letter-spacing: .2em; color: var(--text-mute); }
.key.close { flex: 1.6; color: var(--red); }
.key.go { flex: 2.4; color: var(--accent); border-color: rgba(77,255,168,.55); background: rgba(77,255,168,.1); letter-spacing: .1em; }
body.kbd-open .search-input { border-color: var(--accent); box-shadow: 0 0 12px rgba(77,255,168,.3); }

body.touch .chassis { grid-template-rows: 110px 38px 38px minmax(0, 1fr) 56px; gap: 6px; }
body.touch .eq-row { height: 28px; padding: 3px 6px 0; }
body.touch .eq { height: 24px; }
body.touch .eq-presets { display: none; }
body.touch .eq-sel { display: flex; }
body.touch .search-row { height: 38px; margin-top: 0; }
body.touch .search-input { height: 38px; font-size: 15px; border-radius: 8px; }
body.touch .search-btn { height: 38px; padding: 0 20px; font-size: 13px; border-radius: 8px; }
body.touch .tag { height: 34px; padding: 0 16px; font-size: 13px; border-radius: 8px; }
body.touch .tags { gap: 6px; }
body.touch .tbtn { width: 50px; height: 34px; font-size: 22px; border-radius: 8px; }
body.touch .mem { grid-template-columns: 50px repeat(10, minmax(0, 1fr)); grid-template-rows: 38px; height: 38px; gap: 4px; }
body.touch .mbtn { height: 38px; flex-direction: column; gap: 0; border-radius: 7px; }
body.touch .mbtn .n { font-size: 13px; line-height: 1.1; }
body.touch .mbtn .f { font-size: 9px; line-height: 1.1; }
body.touch .mbtn.pg { border-color: rgba(91,159,255,.5); }
body.touch .mbtn.pg .n { color: var(--blue); }
body.touch .list-h { height: 20px; }
body.touch .ritem { height: 40px; font-size: 14px; padding: 0 14px; }
body.touch .ritem .rc { font-size: 11px; }
body.touch .results::-webkit-scrollbar { width: 10px; }
body.touch .results::-webkit-scrollbar-thumb { background: #46557a; border-radius: 5px; }
body.touch .kw { width: 64px; }
body.touch .knob { width: 38px; height: 38px; }
body.touch .knob::after { top: 4px; height: 11px; width: 4px; }
body.touch .rbtn { width: 46px; height: 46px; font-size: 12px; }
body.touch .rbtn.play { width: 52px; height: 52px; font-size: 16px; }
body.touch .rbtn.nav { width: 46px; height: 46px; font-size: 22px; padding-bottom: 3px; }
body.touch .band { height: 42px; padding: 0 15px; font-size: 12px; }
body.touch button:active, body.touch .mbtn:active, body.touch .ritem:active, body.touch .tag:active { filter: brightness(1.5); }

/* ============ PORTRAIT (téléphones) : 420 x 760, utilisé quand il donne un plus grand rendu ============ */
body.portrait #stage, body.portrait .chassis { width: 420px; height: 760px; }
body.portrait .chassis { grid-template-rows: 238px 44px 88px minmax(0, 1fr) 124px; gap: 7px; }
body.portrait .top { grid-template-columns: 1fr; grid-template-rows: 120px 110px; gap: 8px; }
body.portrait .tag { height: 40px; }
body.portrait .tbtn { height: 40px; width: 52px; }
body.portrait .mem { grid-template-columns: 56px repeat(5, minmax(0, 1fr)); grid-template-rows: 42px 42px; height: 88px; }
body.portrait .mbtn { height: 42px; }
body.portrait .mbtn.pg { grid-row: span 2; height: auto; }
body.portrait .ritem { height: 44px; }
body.portrait .ctrl { flex-wrap: wrap; align-content: center; padding: 6px 12px; gap: 6px 4px; }
body.portrait .bands { order: -1; width: 100%; }
body.portrait .band { flex: 1; height: 42px; padding: 0; }
body.portrait .kbd { top: auto; height: 300px; }
body.portrait .key { font-size: 16px; }
</style>
</head>
<body>

<div id="stage">
  <div class="chassis">
    <span class="screw tl"></span><span class="screw tr"></span>
    <span class="screw bl"></span><span class="screw br"></span>

    <!-- Rangée 1 -->
    <div class="top">
      <div class="disp">
        <div class="meta">
          <span id="bandMeta">FM STEREO</span>
          <span id="statusMeta">OFF</span>
        </div>

const APIS=["https://de1.api.radio-browser.info/json","https://nl1.api.radio-browser.info/json","https://at1.api.radio-browser.info/json"];

async function apiFetch(path){

}
/* page en https : un flux http serait bloqué, on essaie sa version https */
const SECURE=location.protocol==="https:";
function secureUrl(u){return SECURE&&/^http:\/\//i.test(u)?"https://"+u.slice(7):u}
function mapStations(list){return(list||[]).filter(s=>(s.url_resolved||s.url)&&s.lastcheckok!==0).map(s=>({name:(s.name||"Unknown").trim(),url:secureUrl(s.url_resolved||s.url),freq:s.bitrate?s.bitrate+"k":"—",country:s.countrycode||s.country||"",band:"world",tags:(s.tags||"").split(",").map(t=>t.trim()).filter(Boolean).slice(0,3).join(" · ")}))}
async function searchStations(query){
  const q=(query||"").trim();if(q.length<1)return;
  searchBtn.disabled=true;searchBtn.textContent="…";resultsEl.innerHTML='<div class="loading">Recherche…</div>';panelTitle.textContent=q;
  try{
    const enc=encodeURIComponent(q);
    const[byName,byTag,byCountry]=await Promise.all([
      apiFetch(`/stations/search?name=${enc}&hidebroken=true&order=clickcount&reverse=true&limit=40`),
      apiFetch(`/stations/search?tag=${enc}&hidebroken=true&order=clickcount&reverse=true&limit=30`),
      apiFetch(`/stations/search?country=${enc}&hidebroken=true&order=clickcount&reverse=true&limit=20`)]);
    const seen=new Set();const merged=[];
    for(const list of[byName,byTag,byCountry]){for(const s of(list||[])){if(!seen.has(s.stationuuid)&&(s.url_resolved||s.url)){seen.add(s.stationuuid);merged.push(s)}}}
    merged.sort((a,b)=>(b.clickcount||0)-(a.clickcount||0));
    const mapped=mapStations(merged).slice(0,50);
    if(!mapped.length)resultsEl.innerHTML=`<div class="empty">Rien pour « ${esc(q)} »</div>`;else renderResults(mapped,q);
  }catch{resultsEl.innerHTML='<div class="empty">Erreur réseau</div>'}
  finally{searchBtn.disabled=false;searchBtn.textContent="GO"}
}
async function quickSearch(type,value,label){
  resultsEl.innerHTML='<div class="loading">…</div>';panelTitle.textContent=label;
  try{
    let data;
    if(type==="tag")data=await apiFetch(`/stations/search?tag=${encodeURIComponent(value)}&hidebroken=true&order=clickcount&reverse=true&limit=40`);
    else if(type==="country")data=await apiFetch(`/stations/search?countrycode=${encodeURIComponent(value)}&hidebroken=true&order=clickcount&reverse=true&limit=40`);
    else if(type==="top")data=await apiFetch(`/stations/topclick?limit=30&hidebroken=true`);
    else data=await apiFetch(`/stations/search?name=${encodeURIComponent(value)}&hidebroken=true&order=clickcount&reverse=true&limit=30`);
    renderResults(mapStations(data).slice(0,40),label);
  }catch{resultsEl.innerHTML='<div class="empty">Erreur réseau</div>'}
}
searchBtn.onclick=()=>searchStations(searchInput.value);
searchInput.onkeydown=e=>{if(e.key==="Enter")searchStations(searchInput.value)};

/* ---- Égaliseur tactile : ‹ nom › ---- */
const EQN=Object.keys(EQ_PRESETS);
function cycleEq(d){if(!audioCtx)initAnalyser();const i=EQN.indexOf(currentEq);applyEqPreset(EQN[(i+d+EQN.length)%EQN.length])}
$("eqPrev").onclick=()=>cycleEq(-1);$("eqNext").onclick=()=>cycleEq(1);

/* ---- Clavier AZERTY à l'écran (mode tactile) ---- */
const kbd=$("kbd");
function openKbd(){kbd.classList.add("open");document.body.classList.add("kbd-open")}
function closeKbd(){kbd.classList.remove("open");document.body.classList.remove("kbd-open")}
function typeKey(k){if(k==="⌫")searchInput.value=searchInput.value.slice(0,-1);else searchInput.value+=k.toLowerCase()}
if(TOUCH){
  [["1","2","3","4","5","6","7","8","9","0"],["A","Z","E","R","T","Y","U","I","O","P"],["Q","S","D","F","G","H","J","K","L","M"],["W","X","C","V","B","N","-","⌫"]].forEach(r=>{
    const row=document.createElement("div");row.className="krow";
    r.forEach(k=>{const b=document.createElement("button");b.className="key"+(k==="⌫"?" wide":"");b.textContent=k;b.onclick=()=>typeKey(k);row.appendChild(b)});
    kbd.appendChild(row);
  });
  const last=document.createElement("div");last.className="krow";
  last.innerHTML='<button class="key close" id="kClose">✕</button><button class="key space" id="kSpace">ESPACE</button><button class="key go" id="kGo">GO</button>';
  kbd.appendChild(last);
  $("kClose").onclick=closeKbd;$("kSpace").onclick=()=>typeKey(" ");
  $("kGo").onclick=()=>{closeKbd();searchStations(searchInput.value)};
  searchInput.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"){e.preventDefault();openKbd()}});
  searchBtn.addEventListener("click",closeKbd);
}
addEventListener("contextmenu",e=>{if(e.target.tagName!=="INPUT")e.preventDefault()});

/* ---- Restauration des réglages enregistrés ---- */
(function restore(){
  const d=lsGet();
  if(Array.isArray(d.mem))d.mem.forEach((m,i)=>{if(m&&m.url&&i<MEMORY_COUNT){memories[i]=m;memSaved[i]=m}});
  if(typeof d.vol==="number")setVolume(d.vol);
  if(d.eq&&EQ_PRESETS[d.eq]){currentEq=d.eq;const n=$("eqName");if(n)n.textContent=d.eq;document.querySelectorAll(".eq-btn").forEach(b=>b.classList.toggle("active",b.dataset.eq===d.eq))}
  if(d.last&&d.last.url){current=d.last;currentBand=d.last.band||currentBand}
})();

/* ---- Commandes de l'écran de verrouillage / casque ---- */
if("mediaSession" in navigator){
  const ms=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(_){}};
  ms("play",()=>{if(!playing)playBtn.click()});
  ms("pause",()=>{if(playing)playBtn.click()});
  ms("nexttrack",()=>stepStation(1));
  ms("previoustrack",()=>stepStation(-1));
}
/* iOS : le contexte audio doit être créé pendant un geste de l'utilisateur */
addEventListener("pointerdown",()=>{initAnalyser()},{once:true,capture:true});
/* Application installable + interface disponible hors ligne */
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
  addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
}

renderResults(PRESETS,"Stations");audio.volume=volume;
let t=0;const boot=setInterval(()=>{bars.forEach((b,i)=>{b.style.height=(2+Math.abs(Math.sin(t+i*.4))*22)+"px"});t+=.3;if(t>12){clearInterval(boot);bars.forEach(b=>b.style.height="2px")}},40);
</script>
